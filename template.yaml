AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Notice-to-Calendar — photo of a college notice in, .ics of deadlines out.
  Bharat Builds Tour hackathon, Ship It track.

Parameters:
  ModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model id for the vision extraction call.
  BedrockRegion:
    Type: String
    Default: ap-south-1
    Description: Region to call Bedrock in. May differ from the stack's own region.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      CORS origin allowed to call the API and PUT to the uploads bucket.
      Tighten to the CloudFront domain before recording the demo.
  DeployCdn:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to false to stand up the API/backend without CloudFront — for
      accounts where CloudFront is temporarily blocked (new-account
      verification hold). Flip to true and redeploy once it clears.

Conditions:
  CreateCdn: !Equals [!Ref DeployCdn, "true"]

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
    Timeout: 30
    Architectures: [x86_64]

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterOneDay
            Status: Enabled
            ExpirationInDays: 1

  NoticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.lambda_handler
      Environment:
        Variables:
          UPLOADS_BUCKET: !Ref UploadsBucket
          BEDROCK_REGION: !Ref BedrockRegion
          MODEL_ID: !Ref ModelId
      Policies:
        - Statement:
            - Effect: Allow
              # PutObject is required here even though the browser is the one
              # that PUTs: a presigned URL is signed with the generating
              # principal's credentials, and S3 checks that principal's IAM
              # permissions at USE time, not just generation time. Without
              # this, every presigned upload 403s.
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${UploadsBucket.Arn}/*"
            - Effect: Allow
              # Strands' BedrockModel defaults to streaming (Converse/
              # ConverseStream), which needs InvokeModelWithResponseStream —
              # plain InvokeModel alone is not enough.
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: !Sub "arn:aws:bedrock:${BedrockRegion}::foundation-model/${ModelId}"
      Events:
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload-url
            Method: post
        Extract:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /extract
            Method: post

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateCdn
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCdn
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: SiteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        HttpVersion: http2

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateCdn
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  ApiEndpoint:
    Description: HTTP API base URL — set this as API_BASE in frontend/app.js
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontDomain:
    Description: Live URL for the app
    Value: !If [CreateCdn, !Sub "https://${SiteDistribution.DomainName}", "CDN not deployed — set DeployCdn=true and redeploy"]
  CloudFrontDistributionId:
    Description: Pass to `aws cloudfront create-invalidation`
    Value: !If [CreateCdn, !Ref SiteDistribution, "none"]
  SiteBucketName:
    Description: Pass to `aws s3 sync frontend/`
    Value: !Ref SiteBucket
  UploadsBucketName:
    Value: !Ref UploadsBucket
